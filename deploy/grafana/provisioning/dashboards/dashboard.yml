# Grafana Dashboard Provisioning Configuration
# 自动导入仪表盘

apiVersion: 1

providers:
  - name: 'RoleFit Dashboards'
    orgId: 1
    folder: 'RoleFit'
    folderUid: 'rolefit'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/dashboards
