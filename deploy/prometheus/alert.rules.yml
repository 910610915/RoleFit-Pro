# Prometheus Alert Rules
# 用于 RoleFit-Pro 硬件监控告警

groups:
  # ============================================
  # CPU 告警规则
  # ============================================
  - name: cpu_alerts
    interval: 30s
    rules:
      # CPU 使用率过高
      - alert: HighCPUUsage
        expr: windows_cpu_percent > 80
        for: 5m
        labels:
          severity: warning
          component: cpu
        annotations:
          summary: "CPU 使用率过高"
          description: "实例 {{ $labels.instance }} 的 CPU 使用率已超过 80% (当前: {{ $value }}%)"
          
      # CPU 使用率严重过高
      - alert: CriticalCPUUsage
        expr: windows_cpu_percent > 95
        for: 2m
        labels:
          severity: critical
          component: cpu
        annotations:
          summary: "CPU 使用率严重过高"
          description: "实例 {{ $labels.instance }} 的 CPU 使用率已超过 95% (当前: {{ $value }}%)"

  # ============================================
  # 内存告警规则
  # ============================================
  - name: memory_alerts
    interval: 30s
    rules:
      # 内存使用率过高
      - alert: HighMemoryUsage
        expr: windows_memory_percent > 85
        for: 5m
        labels:
          severity: warning
          component: memory
        annotations:
          summary: "内存使用率过高"
          description: "实例 {{ $labels.instance }} 的内存使用率已超过 85% (当前: {{ $value }}%)"
          
      # 内存不足
      - alert: CriticalMemoryUsage
        expr: windows_memory_percent > 95
        for: 2m
        labels:
          severity: critical
          component: memory
        annotations:
          summary: "内存即将耗尽"
          description: "实例 {{ $labels.instance }} 的内存使用率已超过 95% (当前: {{ $value }}%)"

  # ============================================
  # GPU 告警规则
  # ============================================
  - name: gpu_alerts
    interval: 30s
    rules:
      # GPU 使用率过高
      - alert: HighGPUUsage
        expr: windows_gpu_percent > 90
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU 使用率过高"
          description: "实例 {{ $labels.instance }} 的 GPU 使用率已超过 90% (当前: {{ $value }}%)"
          
      # GPU 温度过高
      - alert: HighGPUTemperature
        expr: windows_gpu_temperature_celsius > 85
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU 温度过高"
          description: "实例 {{ $labels.instance }} 的 GPU 温度已超过 85°C (当前: {{ $value }}°C)"

  # ============================================
  # 磁盘告警规则
  # ============================================
  - name: disk_alerts
    interval: 30s
    rules:
      # 磁盘空间不足
      - alert: LowDiskSpace
        expr: windows_logical_disk_percent_free{volume!~"Boot|Recovery"} < 10
        for: 10m
        labels:
          severity: warning
          component: disk
        annotations:
          summary: "磁盘空间不足"
          description: "实例 {{ $labels.instance }} 的磁盘 {{ $labels.volume }} 可用空间低于 10%"

  # ============================================
  # 服务可用性告警
  # ============================================
  - name: availability_alerts
    interval: 60s
    rules:
      # windows_exporter 离线
      - alert: WindowsExporterDown
        expr: up{job="windows_exporter"} == 0
        for: 1m
        labels:
          severity: critical
          component: exporter
        annotations:
          summary: "Windows Exporter 已离线"
          description: "实例 {{ $labels.instance }} 的 windows_exporter 已停止响应"
