# Prometheus AlertManager Configuration
# 用于告警通知管理

global:
  # 告警路由超时时间
  resolve_timeout: 5m

# 告警路由树
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # 严重告警立即通知
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
    # 警告告警普通通知
    - match:
        severity: warning
      receiver: 'default'

# 接收者配置
receivers:
  - name: 'default'
    # 默认接收者配置（可配置邮件、Slack 等）
    webhook_configs:
      - url: 'http://rolefit-backend:8000/api/alerts/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    # 严重告警接收者
    webhook_configs:
      - url: 'http://rolefit-backend:8000/api/alerts/webhook'
        send_resolved: true
    # 可添加更多接收者：email, slack, pagerduty 等

# 告警抑制规则（可选）
# inhibit_rules:
#   - source_match:
#       severity: critical
#     target_match:
#       severity: warning
#     equal: ['alertname', 'instance']
